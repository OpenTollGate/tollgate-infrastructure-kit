name: ansible-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ansible-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-lint + ansible-core
        run: pip install ansible-lint ansible-core

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        run: ansible-lint playbooks/ roles/

  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - name: Install ansible-core
        run: pip install ansible-core

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Validate inventory parses
        run: ansible-inventory --list --yaml > /dev/null

      - name: Syntax-check all playbooks
        run: |
          status=0
          for pb in playbooks/*.yml; do
            echo "::group::$pb"
            if ! ansible-playbook --syntax-check -i inventory/hosts.yml "$pb"; then
              echo "::error::$pb failed syntax check"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
