---
- name: Install Node.js 22
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node

- name: Clone tollgate-release-explorer
  git:
    repo: "https://github.com/OpenTollGate/tollgate-release-explorer-site.git"
    dest: "{{ tollgate_base_dir }}/src/release-explorer"
    depth: 1
    force: yes
  register: explorer_clone

- name: Check explorer node_modules marker
  stat:
    path: "{{ tollgate_base_dir }}/src/release-explorer/node_modules/.package-lock.json"
  register: explorer_node_modules

- name: Check explorer build output
  stat:
    path: "{{ tollgate_base_dir }}/src/release-explorer/build/index.html"
  register: explorer_build

- name: Install release explorer dependencies
  command: npm install --legacy-peer-deps
  args:
    chdir: "{{ tollgate_base_dir }}/src/release-explorer"
  environment:
    NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  when: explorer_clone.changed or not explorer_node_modules.stat.exists

- name: Build release explorer
  shell: npm run build
  args:
    chdir: "{{ tollgate_base_dir }}/src/release-explorer"
  environment:
    NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    PATH: "{{ ansible_env.PATH }}:/usr/bin:/usr/local/bin"
    CI: "true"
    DISABLE_ESLINT_PLUGIN: "true"
  when: explorer_clone.changed or not explorer_build.stat.exists

- name: Ensure static files directory exists
  file:
    path: "{{ tollgate_static_dir }}/releases"
    state: directory
    mode: '0755'

- name: Deploy release explorer static files
  shell: |
    rsync -a --delete "{{ tollgate_base_dir }}/src/release-explorer/build/" "{{ tollgate_static_dir }}/releases/"
    test -f "{{ tollgate_static_dir }}/releases/index.html"
    test -f "{{ tollgate_static_dir }}/releases/404.html"
