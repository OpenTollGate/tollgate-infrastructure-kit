---
# DQ05 — fleet CI-runner host (`ci_runners` group).
#
# Target of ansible/playbooks/27-act-runner.yml (role: ansible/roles/act_runner).
# Values here OVERRIDE the group floor in
# ansible/inventory/group_vars/ci_runners.yml and the VPS-wide allowlist in
# ansible/inventory/group_vars/all.yml, because DQ05 is not a VPS: it is a
# 4 CPU / 10 GiB machine shared with production co-tenants.
#
# Capability envelope, hard limits and the co-tenant list the caps below are
# derived from: docs/act-runner-dq05.md

# --- Account --------------------------------------------------------------
# DQ05 has no `debian` account (VPS convention); the operator account is the
# only interactive login and `sudo -n true` succeeds, so `become: yes` works.
act_runner_user: "c03rad0r"
act_runner_group: "c03rad0r"

# --- Job caps (derived from the co-tenants, not from load average) --------
# Co-tenants on this host: llama-server :8082 (local inference),
# the full fips-exit-* stack, ngit-ci-deploy-coordinator-1 and
# ngit-ci-deploy-dind-1 (the other CI mechanism, :2375-2376), a strfry relay
# on :7780 — and DQ05 forwards fleet inference over a tunnel, so starving it
# slows every other node.
#
# One pushed commit must never be able to start a second parallel job.
act_runner_job_concurrency: 1
#
# Bounds the per-job CONTAINER cgroup (job containers do not live in the
# service's cgroup, so the systemd caps below do not cover them):
#   --memory=2g       ~40% of the ~5 GiB available RAM
#   --memory-swap=2g  == memory, so a job can never grow into the ~7.8 GiB of
#                     swap that is already in use
#   --cpus=1.5        leaves 2.5 of 4 CPUs for llama-server / fips-exit
#   --pids-limit=512  bounds fork bombs
act_runner_container_options: "--memory=2g --memory-swap=2g --cpus=1.5 --pids-limit=512"
#
# systemd guard for the runner DAEMON only (watcher `git` calls + the `act`
# process). Worst case on DQ05: 1.5 CPU + 2 GiB (job container) plus
# 1.5 CPU + 768 MiB (daemon) = at most 3 of 4 CPUs and ~2.8 GiB of the
# ~5 GiB that is available, ~7.8 GiB of swap left untouched.
act_runner_systemd_cpu_quota: "150%"
act_runner_systemd_memory_max: "768M"

# --- No Caddy / no public subdomain on DQ05 ------------------------------
# orangesync.tech does not resolve from DQ05 (ngit1/relay1/runner/git.* all
# return code 000), and DQ05 has no `runner.` record. The role's final
# `https://{{ act_runner_domain }}/api/health` check would therefore fail the
# play *after* a successful deploy, so it is gated off. Reachability is still
# verified on http://localhost:8095/api/health, which always runs.
act_runner_verify_caddy: false

# --- `act` binary: declared pin, not a silent drift ----------------------
# DQ05 already has act 0.2.89 at /usr/local/bin/act (newer than the VPS pin
# of 0.2.77, and the version carrying the node24 runtime). The role's install
# task is `creates:`-guarded, so it will never replace an existing binary.
# Pin this host to what is actually deployed instead of leaving the mismatch
# implicit: if the binary is ever removed the role installs 0.2.89, and the
# role's version-drift check stays quiet because the declaration matches
# reality. Both flags the role passes (`--concurrent-jobs`,
# `--container-options`) exist in 0.2.89 — verified with `act push --help`.
act_runner_version: "0.2.89"

# --- Repo allowlist: DQ05 needs its own -----------------------------------
# The shared allowlist in group_vars/all.yml points at
# `http://localhost:7334/...`, which is the ngit-grasp mirror on vps1. From
# DQ05 port 7334 is not listening (curl → 000), so inheriting that list would
# hand the runner a set of unreachable repos.
#
# GitHub IS reachable from DQ05 (https://github.com/OpenTollGate/tollgate-module-basic-go
# → HTTP 200, `git ls-remote` HEAD → 60530c6772b5c5fa0c4559ae5d754c19ac8aefb6),
# and the org's GitHub Actions is down (org suspended) — which is the reason
# this runner exists.
#
# Deliberately minimal: only lanes that fit an act-in-a-container runner
# (Go build/test/vet/lint + pure shell). Docker/SDK lanes cannot run here at
# all — `act` gives job containers no nested Docker daemon.
act_runner_repos:
  - url: "https://github.com/OpenTollGate/tollgate-module-basic-go.git"
    branch: "main"

# --- Relay list: DQ05 publishes to its own relay --------------------------
# The shared list points at `wss://ngit.{{ base_domain }}` /
# `wss://relay.{{ base_domain }}`, which DQ05 cannot reach (code 000), so
# build events would be published into the void. DQ05 runs its own strfry
# bound on 0.0.0.0:7780, reachable and answering `nak req`.
act_runner_relays:
  - "ws://127.0.0.1:7780"
