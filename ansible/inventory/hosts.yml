all:
  hosts:
    vps1:
      ansible_host: "{{ lookup('env', 'VPS_IP') }}"
      ansible_user: "{{ lookup('env', 'VPS_USER') | default('debian', true) }}"
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=15"
      ansible_become_password: "{{ lookup('env', 'VPS_PASSWORD') | default('', true) }}"
    vps2:
      ansible_host: "{{ lookup('env', 'VPS2_IP') }}"
      ansible_user: "{{ lookup('env', 'VPS2_USER') | default('debian', true) }}"
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=15"
      ansible_become_password: "{{ lookup('env', 'VPS2_PASSWORD') | default('', true) }}"
    vps3:
      ansible_host: "{{ lookup('env', 'VPS3_IP') }}"
      ansible_user: "{{ lookup('env', 'VPS3_USER') | default('debian', true) }}"
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=15"
      ansible_become_password: "{{ lookup('env', 'VPS3_PASSWORD') | default('', true) }}"
    backup:
      ansible_host: "{{ lookup('env', 'BACKUP_MACHINE_HOST') }}"
      ansible_user: "{{ lookup('env', 'BACKUP_MACHINE_USER') | default('c03rad0r', true) }}"
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=15"
  children:
    vps:
      hosts:
        vps1:
        vps2:
        vps3:
    m1:
      hosts:
        vps1:
    m2:
      hosts:
        vps2:
    m3:
      hosts:
        vps3:
    backup_group:
      hosts:
        backup:
    # CI-runner hosts target the act_runner role (ansible/playbooks/27-act-runner.yml).
    # Group-wide defaults live in ansible/inventory/group_vars/ci_runners.yml;
    # host-specific knobs (including resource caps) in
    # ansible/inventory/host_vars/<host>.yml.
    ci_runners:
      hosts:
        vps1:
        vps2:
        dq05:
    nip29_relays:
      hosts:
        dq05:
          # Also a CI-runner host: see the `ci_runners` group below and
          # ansible/inventory/host_vars/dq05.yml for its resource caps.
          ansible_host: "{{ lookup('env', 'DQ05_NETBIRD_IP') | default('100.90.22.201', true) }}"
          ansible_user: c03rad0r
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          nip29_domain: "{{ lookup('env', 'DQ05_NETBIRD_IP') | default('100.90.22.201', true) }}"
        t470:
          ansible_host: "{{ lookup('env', 'T470_NETBIRD_IP') | default('100.90.101.9', true) }}"
          ansible_user: c03rad0r
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          ansible_connection: local
          nip29_domain: "{{ lookup('env', 'T470_NETBIRD_IP') | default('100.90.101.9', true) }}"
